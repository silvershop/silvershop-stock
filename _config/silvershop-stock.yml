---
name: silvershop-stock
---
SilverShop\Page\Product:
  extensions:
    - SilverShop\Stock\Extensions\ProductStockExtension

SilverShop\Model\Variation\Variation:
  extensions:
    - SilverShop\Stock\Extensions\ProductStockExtension

SilverShop\Forms\AddProductForm:
  extensions:
    - SilverShop\Stock\Extensions\AddProductExtension

SilverShop\Model\Order:
  extensions:
    - SilverShop\Stock\Extensions\OrderExtension

SilverShop\Model\OrderItem:
  extensions:
    - SilverShop\Stock\Extensions\OrderItemExtension

SilverShop\Admin\ProductCatalogAdmin:
  managed_models:
    - SilverShop\Stock\Model\ProductWarehouse

---
Name: silvershop-stock-category-eager
After:
  - silvershop-category-index
---
# Eager-load Variations on category listings. Ordered after silvershop-category-index so the same extension also
# post-processes that module's overridden product list (via overrideProductsShowable). Harmless when
# category-index is absent (the After reference is simply skipped).
SilverShop\Page\ProductCategory:
  extensions:
    - SilverShop\Stock\Extensions\ProductCategoryStockExtension
